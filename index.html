<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POTATO DEX - PS1 Demo Disc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/custom-animations.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-black text-white overflow-hidden select-none w-screen h-screen relative">

  <!-- CAPA 1: Escena 3D (Papa al centro + Anillo de Recetas) -->
  <canvas id="webgl-canvas" class="fixed top-0 left-0 w-full h-full z-0"></canvas>

  <!-- CAPA 2: Efecto televisor CRT -->
  <div class="scanlines pointer-events-none fixed inset-0 z-10"></div>

  <!-- CAPA 3: Efecto de Transición de Combate (Flash de entrada a minijuego) -->
  <div id="transition-overlay" class="pointer-events-none fixed inset-0 z-40 opacity-0 bg-white"></div>

  <!-- CAPA 4: Interfaz Principal (HUD) -->
<!-- CAPA 4: Interfaz Principal (Compacta en móvil, Panel lateral en PC) -->
  <main id="ui-layer" class="relative z-20 w-full h-full pointer-events-none flex flex-col justify-between p-2 md:p-6">
    
    <!-- Barra Superior Compacta -->
    <!-- Barra Superior con Controles de Radio DnB -->
    <header class="flex justify-between items-start gap-2">
      <div class="ps1-box px-2.5 py-1 md:px-4 md:py-2 pointer-events-auto">
        <h1 class="text-lg md:text-3xl text-yellow-400 tracking-wider leading-none">PROYECTO: SOLANUM</h1>
        <p class="text-xs md:text-sm text-cyan-300 leading-tight mt-0.5">Scroll / Desliza: Rotar | Clic: Seleccionar</p>
      </div>
      
      <div class="flex items-start gap-2 pointer-events-auto shrink-0">
        <!-- Reproductor Atmospheric DnB -->
        <div class="ps1-box px-2.5 py-1 md:px-3 md:py-2 flex items-center gap-2">
          <button id="btn-bgm-toggle" class="text-xs md:text-base text-yellow-300 hover:text-white">
            [ ▶ BGM: OFF ]
          </button>
          <button id="btn-bgm-next" class="text-xs md:text-base text-cyan-300 hover:text-white border-l border-blue-400/40 pl-2" title="Siguiente canción (Fade)">
            ⏭
          </button>
        </div>

        <div class="ps1-box px-2.5 py-1 md:px-4 md:py-2 text-right">
          <span class="text-[10px] md:text-xs text-gray-400 block leading-none">ARCHIVOS</span>
          <span id="unlock-counter" class="text-base md:text-2xl text-green-400 font-bold leading-tight">0 / 4</span>
        </div>
      </div>
    </header>

    <!-- Panel de Información: Lateral derecho en PC, barra inferior pequeña en Móvil -->
    <section class="ps1-box w-full md:w-80 lg:w-96 md:my-auto md:ml-auto p-2.5 md:p-5 pointer-events-auto text-left flex flex-col gap-1.5 md:gap-3">
      <div class="flex items-center justify-between border-b border-blue-400/40 pb-1">
        <span id="selected-author" class="text-[11px] md:text-xs text-cyan-300 uppercase tracking-widest">SISTEMA CENTRAL</span>
        <span id="selected-index-badge" class="text-[11px] md:text-xs bg-blue-950 px-1.5 py-0.5 text-yellow-300 border border-blue-500">ORIGEN</span>
      </div>

      <h2 id="selected-title" class="text-lg md:text-2xl text-yellow-300 leading-none">
        [ PAPA CRUDA ]
      </h2>

      <p id="selected-desc" class="text-xs md:text-base text-gray-200 leading-snug line-clamp-3 md:line-clamp-none">
        El tubérculo base. Gira la rueda o haz clic en un signo "???" para ver sus evoluciones.
      </p>

      <button id="btn-action" class="hidden w-full bg-red-700 hover:bg-red-600 border border-white py-1.5 px-3 text-sm md:text-lg text-white active:scale-95 transition text-center mt-1">
        ▶ INICIAR DESAFÍO
      </button>
    </section>

  </main>

  <!-- CAPA 5: Contenedor Modal para los Minijuegos (Oculto hasta que le den al botón) -->
  <section id="minigame-modal" class="hidden fixed inset-0 z-30 bg-black/95 flex items-center justify-center p-2 md:p-6">
    <div class="ps1-box w-full max-w-3xl h-[85vh] flex flex-col justify-between p-4 md:p-6 relative">
      
      <!-- Cabecera del Minijuego -->
      <div class="flex justify-between items-center border-b-2 border-gray-500 pb-2">
        <h3 id="minigame-title" class="text-xl md:text-3xl text-yellow-400">DESAFÍO #1</h3>
        <button id="btn-exit-game" class="text-red-400 hover:text-red-300 text-lg md:text-2xl px-2">[ HUIR ]</button>
      </div>

      <!-- Escenario donde cada compañero inyecta su juego -->
      <div id="minigame-stage" class="flex-1 my-4 bg-black border-2 border-gray-700 relative overflow-hidden flex items-center justify-center">
        <!-- El código de game-ff7.js o game-survivor.js se dibuja aquí adentro -->
      </div>

    </div>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
