<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POTATO DEX - PS1 Demo Disc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/custom-animations.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-black text-white overflow-hidden select-none w-screen h-screen relative">

  <!-- CAPA 1: Escena 3D (Papa al centro + Anillo de Recetas) -->
  <canvas id="webgl-canvas" class="fixed top-0 left-0 w-full h-full z-0"></canvas>

  <!-- CAPA 2: Efecto televisor CRT -->
  <div class="scanlines pointer-events-none fixed inset-0 z-10"></div>

  <!-- CAPA 3: Efecto de Transición de Combate (Flash de entrada a minijuego) -->
  <div id="transition-overlay" class="pointer-events-none fixed inset-0 z-40 opacity-0 bg-white"></div>

  <!-- CAPA 4: Interfaz Principal (HUD) -->
<!-- CAPA 4: Interfaz Principal (Compacta en móvil, Panel lateral en PC) -->
  <main id="ui-layer" class="fixed inset-0 z-20 pointer-events-none flex flex-col justify-between p-2 sm:p-4 w-screen h-[100dvh] overflow-hidden">
    
    <!-- Barra Superior Compacta -->
    <header class="flex justify-between items-start gap-2">
      <div class="ps1-box px-2 py-1 md:px-4 md:py-2 pointer-events-auto">
        <h1 class="text-sm sm:text-lg md:text-3xl text-yellow-400 tracking-wider leading-none">PROYECTO: PAPA</h1>
        <p class="text-[10px] sm:text-xs md:text-sm text-cyan-300 leading-tight mt-0.5">Desliza / Scroll: Rotar | Clic: Seleccionar</p>
      </div>
      
      <div class="flex items-start gap-1.5 sm:gap-2 pointer-events-auto shrink-0">
        <div class="ps1-box px-2 py-1 md:px-3 md:py-2 flex items-center gap-1.5 sm:gap-2">
          <button id="btn-bgm-toggle" class="text-[11px] sm:text-xs md:text-base text-yellow-300 hover:text-white">
            [ ▶ BGM: OFF ]
          </button>
          <button id="btn-bgm-next" class="text-[11px] sm:text-xs md:text-base text-cyan-300 hover:text-white border-l border-blue-400/40 pl-1.5 sm:pl-2">
            ⏭
          </button>
        </div>

        <div class="ps1-box px-2 py-1 md:px-4 md:py-2 text-right">
          <span class="text-[9px] sm:text-[10px] md:text-xs text-gray-400 block leading-none">ARCHIVOS</span>
          <span id="unlock-counter" class="text-sm sm:text-base md:text-2xl text-green-400 font-bold leading-tight">0 / 4</span>
        </div>
      </div>
    </header>

    <!-- Tarjeta Inferior del Hub: Compacta en móvil para que el botón SIEMPRE entre en pantalla -->
    <footer class="w-full max-w-4xl mx-auto pointer-events-auto">
      <div class="ps1-box p-2 sm:p-3 md:p-4 flex flex-col gap-1 sm:gap-1.5">
        <div class="flex justify-between items-center border-b border-blue-400/40 pb-0.5 sm:pb-1">
          <span id="selected-author" class="text-[10px] sm:text-xs md:text-sm text-cyan-300 tracking-widest">SISTEMA CENTRAL</span>
          <span id="selected-index-badge" class="text-[10px] sm:text-xs bg-blue-950 border border-blue-400 px-1.5 py-0.5 text-yellow-300">ORIGEN</span>
        </div>

        <!-- En pantallas bajas/móviles pone el texto a la izquierda y el botón a la derecha para ahorrar altura -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 sm:gap-3">
          <div class="flex-1 min-w-0">
            <h2 id="selected-title" class="text-sm sm:text-lg md:text-2xl text-yellow-300 leading-tight truncate">[ PAPA CRUDA ]</h2>
            <p id="selected-desc" class="text-[11px] sm:text-xs md:text-base text-gray-100 leading-tight line-clamp-2">
              El tubérculo base. Gira la rueda o haz clic en un signo "?" para ver sus evoluciones.
            </p>
          </div>

          <button id="btn-action" class="hidden shrink-0 sm:w-auto w-full bg-red-700 hover:bg-red-600 border border-white py-1 sm:py-2 px-3 sm:px-5 text-xs sm:text-sm md:text-lg text-white active:scale-95 transition">
            ▶ DESBLOQUEAR JUEGO
          </button>
        </div>
      </div>
    </footer>
  </main>

  <section id="minigame-modal" class="hidden fixed inset-0 z-30 bg-black w-screen h-[100dvh] overflow-hidden">
    <button id="btn-exit-game" class="fixed top-1.5 left-1.5 z-50 ps1-box px-2 py-0.5 sm:px-3 sm:py-1 text-red-400 hover:text-white text-xs sm:text-sm md:text-lg">
      [ ◀ HUB ]
    </button>
    <div id="minigame-stage" class="w-full h-full relative overflow-hidden flex items-center justify-center"></div>
  </section>

  <!-- PANTALLA DE ENTRADA: espera a que la música esté lista y aporta el gesto necesario para el audio -->
  <div id="boot-screen" class="fixed inset-0 z-[60] bg-black flex flex-col items-center justify-center gap-3 sm:gap-5 p-4 h-[100dvh] transition-opacity duration-500">
    <h1 class="text-2xl sm:text-4xl md:text-5xl text-yellow-400 tracking-widest text-center leading-none">PROYECTO: PAPA</h1>
    <p class="text-xs sm:text-base text-cyan-300 text-center leading-tight">🎧 Se recomienda usar audífonos</p>

    <div class="w-[min(70vw,420px)] h-3 bg-zinc-800 border border-blue-400">
      <div id="boot-bar" class="h-full w-0 bg-cyan-300 transition-[width] duration-300"></div>
    </div>
    <p id="boot-status" class="text-xs sm:text-base text-gray-300 text-center leading-tight">CARGANDO MÚSICA...</p>

    <button id="btn-enter" disabled class="ps1-box px-6 py-2 sm:px-10 sm:py-3 text-sm sm:text-xl text-yellow-300 hover:text-white disabled:opacity-40 disabled:cursor-wait">
      CARGANDO...
    </button>
  </div>

  <script type="module" src="./js/main.js?v=5"></script>
</body>
</html>
